[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "mkdocs-devblog-theme"
version = "0.1.0"
description = "Standalone MkDocs theme for the dev blog"
requires-python = ">=3.10"
dependencies = ["mkdocs>=1.6"]

[project.entry-points."mkdocs.themes"]
devblog = "devblog"

[tool.setuptools]
packages = ["devblog"]
package-dir = { devblog = "theme" }
include-package-data = true

[tool.setuptools.package-data]
devblog = ["**/*.html", "**/*.css", "**/*.js", "mkdocs_theme.yml"]
