services:
  mkdocs:
    image: docker.io/binarycodes/mkdocs-dev-blog:latest
    container_name: mkdocs
    volumes:
      - ./docs:/blog/docs:ro
      - ./mkdocs.yml:/blog/mkdocs.yml:ro
    ports:
      - "8000:8000"
    # the site is built at start; restart the container to publish new posts
    restart: unless-stopped
